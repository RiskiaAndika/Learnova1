<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Kuis • Learnova</title><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../../assets/css/platform.css"><script src="../../assets/js/layout.js" defer></script><script src="../../assets/js/teacher-quizzes.js" defer></script></head><body data-role="penyelenggara" data-page="kuis" data-title="Kelola Kuis"><div id="pageContent">
